<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      content="width=device-width, initial-scale=1.0"
      name="viewport"
    />
    <meta content="#f3f3f3" name="theme-color" />

    <!--
      Native window, WebView and document surfaces must remain aligned.
      See docs/adr/0001-opaque-window-surface.md.
    -->
    <style id="window-backing-surface">
      :root {
        --window-backing-surface: #f3f3f3;
        --fatal-foreground: #18181b;
        --fatal-muted: #71717a;
        --fatal-border: #d4d4d8;
        --fatal-hover: rgb(24 24 27 / 5%);
        --fatal-danger: #b42318;
        --fatal-danger-surface: #fee4e2;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--window-backing-surface);
      }

      .fatal-surface,
      .fatal-surface * {
        box-sizing: border-box;
      }

      .fatal-surface {
        display: grid;
        width: 100%;
        min-height: 100%;
        place-items: center;
        overflow: auto;
        padding: 48px 32px;
        color: var(--fatal-foreground);
        background: var(--window-backing-surface);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .fatal-content {
        width: min(100%, 620px);
      }

      .fatal-title {
        margin: 22px 0 0;
        font-size: 20px;
        font-weight: 650;
        line-height: 1.4;
        letter-spacing: -0.015em;
      }

      .fatal-description {
        max-width: 560px;
        margin: 10px 0 0;
        color: var(--fatal-muted);
        font-size: 14px;
        line-height: 1.7;
      }

      .fatal-summary,
      .fatal-secondary {
        margin: 12px 0 0;
        color: var(--fatal-muted);
        font-family:
          "Cascadia Code",
          "SFMono-Regular",
          Consolas,
          "Liberation Mono",
          monospace;
        font-size: 11px;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }

      .fatal-secondary {
        font-family: inherit;
      }

      .fatal-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 24px;
      }

      .fatal-details summary:focus-visible {
        outline: 2px solid rgb(24 24 27 / 35%);
        outline-offset: 2px;
      }

      .fatal-details {
        margin-top: 28px;
        padding-top: 18px;
        border-top: 1px solid var(--fatal-border);
      }

      .fatal-details summary {
        width: fit-content;
        color: var(--fatal-muted);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        user-select: none;
      }

      .fatal-diagnostic {
        max-height: 320px;
        margin: 16px 0 0;
        overflow: auto;
        color: #3f3f46;
        font-family:
          "Cascadia Code",
          "SFMono-Regular",
          Consolas,
          "Liberation Mono",
          monospace;
        font-size: 11px;
        line-height: 1.7;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        user-select: text;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --window-backing-surface: #18181b;
          --fatal-foreground: #f4f4f5;
          --fatal-muted: #a1a1aa;
          --fatal-border: #3f3f46;
          --fatal-hover: rgb(255 255 255 / 6%);
          --fatal-danger: #f97066;
          --fatal-danger-surface: rgb(240 68 56 / 14%);
        }

        .fatal-diagnostic {
          color: #d4d4d8;
        }
      }

      @media (max-width: 640px) {
        .fatal-surface {
          place-items: start;
          padding: 40px 24px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .fatal-icon-button {
          transition: none;
        }
      }

    /* fatal-pre-react-icon-actions */
    .fatal-icon-button {
      display: inline-grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 0;
      border-radius: 6px;
      padding: 0;
      color: var(--fatal-foreground);
      background: transparent;
      cursor: pointer;
      opacity: 0.78;
      transition:
        opacity 120ms ease,
        transform 120ms ease;
    }

    .fatal-icon-button:hover {
      background: transparent;
      opacity: 1;
    }

    .fatal-icon-button:active {
      background: transparent;
      opacity: 1;
      transform: scale(0.9);
    }

    .fatal-icon-button:focus-visible {
      background: transparent;
      opacity: 1;
      outline: 2px solid rgb(24 24 27 / 35%);
      outline-offset: 2px;
    }

    .fatal-icon-button svg {
      display: block;
      width: 16px;
      height: 16px;
      overflow: visible;
    }

    .fatal-diagnostic {
      background: var(--window-backing-surface);
      scrollbar-color: var(--fatal-muted) var(--window-backing-surface);
    }

    .fatal-diagnostic::-webkit-scrollbar-track {
      background: var(--window-backing-surface);
    }

    .fatal-diagnostic::-webkit-scrollbar-thumb {
      border: 3px solid var(--window-backing-surface);
      border-radius: 999px;
      background: var(--fatal-muted);
    }

    @media (prefers-color-scheme: dark) {
      .fatal-icon-button:focus-visible {
        outline-color: rgb(244 244 245 / 45%);
      }
    }



    
/* fatal-error-illustration */
.fatal-illustration {
  display: block;
  width: 132px;
  height: 132px;
  margin: 0 0 20px;
  object-fit: contain;
}

    </style>

    <title>Poietica</title>
  </head>

  <body>
    <div id="root"></div>

    <!--
      Fatal startup screen skeleton and icons. The pre-React entry only writes
      text and swaps icons; it never builds markup.
    -->
    <template id="fatal-screen">
      <main aria-live="assertive" class="fatal-surface" role="alert">
        <section class="fatal-content">
          <img alt="" aria-hidden="true" class="fatal-illustration" />
          <h1 class="fatal-title"></h1>
          <p class="fatal-description"></p>
          <p class="fatal-summary"></p>
          <p class="fatal-secondary" hidden></p>

          <div aria-label="错误处理操作" class="fatal-actions" role="group">
            <button class="fatal-icon-button" data-action="reload" hidden type="button"></button>
            <button class="fatal-icon-button" data-action="copy" type="button"></button>
            <button class="fatal-icon-button" data-action="close" type="button"></button>
          </div>

          <details class="fatal-details">
            <summary></summary>
            <pre class="fatal-diagnostic"></pre>
          </details>
        </section>
      </main>
    </template>

    <template id="fatal-icons">
      <svg aria-hidden="true" data-icon="reload" fill="none" focusable="false" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M8 16H3v5" /></svg>
      <svg aria-hidden="true" data-icon="copy" fill="none" focusable="false" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><rect height="14" rx="2" ry="2" width="14" x="8" y="8" /><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></svg>
      <svg aria-hidden="true" data-icon="copied" fill="none" focusable="false" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></svg>
      <svg aria-hidden="true" data-icon="close" fill="none" focusable="false" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
    </template>

    <!--
      This module installs the browser failure collectors before the React
      entry executes. It renders nothing during a healthy startup.
    -->
    <script
      src="/src/pre-react-entry.ts"
      type="module"
    ></script>

    <script
      src="/src/main.tsx"
      type="module"
    ></script>
  </body>
</html>
