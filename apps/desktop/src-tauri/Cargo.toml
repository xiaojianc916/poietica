[package]
name = "poietica"
default-run = "poietica"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "poietica_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[package.metadata]
tauri-build = { version = "2.0" }

[lints]
workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
# 渲染层送来的图片是 base64；字节要落盘就得解出来。这是标准做法里最没有
# 争议的一件：手写一个 base64 解码器不会比它更快，只会多一处要自己维护的
# 边界条件（填充、换行、URL 变体）。
base64.workspace = true
# 版本比较交给 cargo 自己用的那个实现，不手搓字符串比大小。
semver.workspace = true
hex.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
toml_edit.workspace = true
uuid.workspace = true
poietica-kap-client = { path = "../../../crates/kap-client" }
poietica-asset = { path = "../../../crates/asset" }
poietica-browser-native = { path = "../../../crates/browser" }
poietica-git-adapter-native = { path = "../../../crates/git-adapter" }

# 除 opener 外，这份清单与 bootstrap/app.rs 里注册的插件一一对应。
#
# 此前它多出六个：clipboard-manager、fs、opener、process、shell、updater。
# 它们全都没有 init，capabilities/main-window.json 里也没有对应权限，所以连被
# 前端调用的可能都没有 —— 纯粹链进产物的死重量，其中 fs 与 shell 还是 Tauri
# 最敏感的两个能力面，会让每一次依赖审计都停下来问一遍。
#
# opener 是被删掉的那六个里唯一回来的，而且回来的方式不一样：它没有出现在
# app.rs 的 .plugin() 链里，也没有出现在 capabilities 里。这里只把它当一个
# 普通库用 —— commands::window::window_open_external_url 直接调 open_url()。
#
# 差别是实打实的：注册成插件，等于把 plugin:opener|* 那一整组 IPC 命令的权限
# 交给 webview；当作库，webview 能碰到的只有我们自己那一条命令，参数在进系统
# 浏览器之前先过一遍协议白名单。渲染层要的从来就只是"把这个 URL 扔出去"。
#
# 为什么非要有它：主窗口是 decorations: false 的自绘标题栏，没有地址栏也没有
# 后退。在此之前，AI 回答里的任何一个链接、设置页里的任何一个 apiKeysUrl，点
# 下去都是让 webview 自己导航走 —— 应用当场变成一个回不来的浏览器。
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-log.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-store.workspace = true
tauri-plugin-window-state.workspace = true

reqwest.workspace = true

specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true
tokio.workspace = true
poietica-conversation = { path = "../../../crates/conversation" }
poietica-ledger = { path = "../../../crates/ledger" }
poietica-extension-native = { path = "../../../crates/extension" }
poietica-problem = { path = "../../../crates/problem" }
poietica-terminal-native = { path = "../../../crates/terminal" }
poietica-time = { path = "../../../crates/time" }
poietica-update-native = { path = "../../../crates/update" }
rmcp.workspace = true
axum.workspace = true
schemars.workspace = true

[dev-dependencies]
tempfile.workspace = true
