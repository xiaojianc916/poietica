# 打包配置（15 页 §10.4 的完整内容；P3 的最小骨架到此补齐）。
#
# appId 与 legacy 保持一致：NSIS 用它生成安装标识，相同 appId 的新版本会作为升级
# 覆盖安装 0.4.4，legacy 用户也能通过自动更新收到 0.5.0（15 页 §10.4 第一行）。
appId: com.poietica.Poietica
productName: Poietica

directories:
  output: release
  buildResources: resources

# 用已经装好的 Electron，不从网络再下一遍 100 MB 的 zip（发布链上最容易在这里失败）。
electronDist: ../../node_modules/electron/dist
# 与 legacy 相同的产物名：差分更新按文件名推算旧版本的 blockmap 地址，
# 名字格式不变才能从 0.4.4 差分升级。
artifactName: ${productName}_${version}_x64-setup.${ext}

# 只打包 electron-vite 的产物：src 与工作区包的 TS 源码都不进安装包。
files:
  - out/**
  - package.json

asar: true
# 原生模块不能从 asar 内加载；node-pty 还要执行同目录下的 conpty.dll 与 OpenConsole.exe。
asarUnpack:
  - "**/*.node"
  - "**/node_modules/@lydell/node-pty*/**"

# Core 是独立的 exe，不能放进 asar；桌面侧的 coreExe 路径读的就是 resources/core（06 页 §7）。
extraResources:
  - from: ../core/dist
    to: core
    filter:
      - poietica-core.exe
      - pi_natives.*.node
      - core-manifest.json
  - from: resources/icon.ico
    to: icon.ico

# 界面只有中文，en-US 是 Chromium 的回退语言；不写会多出 48 MB 的 locale 文件。
electronLanguages:
  - zh-CN
  - en-US

win:
  target:
    - target: nsis
      arch:
        - x64
  executableName: Poietica

nsis:
  # 显示安装向导（可改安装目录），安装到用户目录、不需要管理员权限，
  # 卸载时保留数据根（对话、设置、API key 都在里面）。
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false
  # 生成 .blockmap，自动更新只下载变化的块。
  differentialPackage: true

publish:
  provider: github
  owner: xiaojianc916
  repo: poietica
  # 草稿对客户端不可见：人工验收后才发布（15 页 §10.5）。
  releaseType: draft
