[package]
name = "poietica"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Electron 主进程要的是一个 Node 动态库，不是可执行文件：原来的进程入口搬到
# apps/desktop/electron，这里只留一个能被 require 的模块。
#
# lib 与 cdylib 并存：cdylib 给 Node 加载，lib 给这个 crate 自己的单测与导出可执行文件。
[lib]
name = "poietica"
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[build-dependencies]
napi-build.workspace = true

[dependencies]
napi.workspace = true
napi-derive.workspace = true

# 契约导出：命令面渲染成 TypeScript 的地方。specta 是类型的产地，
# specta-typescript 只是把它渲染出来；两者版本必须成套，别单个升。
specta.workspace = true
specta-typescript.workspace = true
heck.workspace = true

poietica-agent-client = { path = "../../../crates/agent-client" }
poietica-asset = { path = "../../../crates/asset" }
poietica-automation = { path = "../../../crates/automation" }
poietica-automation-runtime = { path = "../../../crates/automation-runtime" }
poietica-conversation = { path = "../../../crates/conversation" }
poietica-conversation-runtime = { path = "../../../crates/conversation-runtime" }
poietica-extension-native = { path = "../../../crates/extension" }
poietica-git-adapter-native = { path = "../../../crates/git-adapter" }
poietica-ledger = { path = "../../../crates/ledger" }
poietica-problem = { path = "../../../crates/problem" }
poietica-process-host = { path = "../../../crates/process-host" }
poietica-python-native = { path = "../../../crates/python-runtime" }
poietica-review-native = { path = "../../../crates/review" }
poietica-terminal-native = { path = "../../../crates/terminal" }
poietica-time = { path = "../../../crates/time" }

# 渲染层送来的图片是 base64；字节要落盘就得解出来。手写解码器只会多一处边界条件。
base64.workspace = true
fs2.workspace = true
hex.workspace = true
iana-time-zone.workspace = true
log.workspace = true
axum.workspace = true
rmcp.workspace = true
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
tokio.workspace = true
uuid.workspace = true
reqwest.workspace = true

[[bin]]
name = "export-ipc-bindings"
path = "src/bin/export-ipc-bindings.rs"
