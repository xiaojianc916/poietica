[workspace]
resolver = "3"
members = [
  "apps/desktop/native",
  "crates/asset",
  "crates/automation",
  "crates/automation-runtime",
  "crates/browser",
  "crates/conversation",
  "crates/conversation-runtime",
  "crates/extension",
  "crates/git-adapter",
  "crates/agent-client",
  "crates/ledger",
  "crates/problem",
  "crates/process-host",
  "crates/review",
  "crates/terminal",
  "crates/time",
]
default-members = [
  "apps/desktop/native",
]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.95"
authors = ["Poietica Contributors"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/xiaojianc916/poietica"
publish = false

[workspace.dependencies]
croner = "=4.0.0"
chrono = "0.4.42"
chrono-tz = "0.10.4"
iana-time-zone = "0.1.64"
schemars = "1.2.2"
axum = "0.8.9"
rmcp = { version = "3.1.2", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
# Error handling
anyhow = "1.0.98"
log = "0.4.27"
thiserror = "2.0.12"

# Async runtime
futures = "0.3.31"
tokio = { version = "1.45.1", features = [
  "fs", "io-util", "macros", "process",
  "rt-multi-thread", "signal", "sync", "time",
] }
tokio-util = { version = "0.7.15", features = ["rt"] }

# Serialization and validation
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_with = "3.13.0"
toml = "0.8.23"

# 保留格式的原地 TOML 编辑。
#
# 与上面的 toml 不是重复：toml 是「反序列化成结构体」，往回写会重排键序、丢掉注释
# 与空行。我们要改的是 agent 自己的 config.toml —— 那是用户和 agent 自己都在写的
# 文件，把它重排一遍等于把别人的东西弄乱。
#
# 业界标杆同款：Zed 根 Cargo.toml 逐字 toml_edit = { version = "0.22", ... }，
# tooling/xtask/src/tasks/publish_gpui.rs 逐字
# toml_contents.parse::<toml_edit::DocumentMut>() 之后 package.insert(...)。
#
# 不开 serde feature：我们不做结构体映射，只按名字改一个标量键。
toml_edit = { version = "0.22.27", default-features = false, features = [
  "display", "parse",
] }
url = { version = "2.5.4", features = ["serde"] }

# Stable identifiers and time
time = { version = "0.3.41", features = [
  "formatting", "local-offset", "macros", "parsing", "serde",
] }
uuid = { version = "1.16.0", features = ["serde", "v4", "v7"] }

# File, archive and content-addressed storage
hex = "0.4.3"
sha2 = "0.10.9"
tempfile = "3.20.0"
trash = "5.2.6"
walkdir = "2.5.0"
zip = { version = "4.0.0", default-features = false, features = [
  "deflate", "time", "zstd",
] }
zstd = "0.13.3"

# Native file locking and watching
fs2 = "0.4.3"
notify = "8.0.0"

# Plugin signature and integrity verification
base64 = "0.22.1"

# Observability


# HTTP 客户端，全仓一份：厂商密钥探测、插件目录抓取、更新清单与载荷下载都走它。
#
# rustls-tls 不带第二套 TLS。
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls", "json", "multipart", "stream",
] }


# IPC contract generation.
#
# These prerelease versions are deliberately pinned as a compatible set.
# Do not upgrade one of them independently.
specta = { version = "=2.0.0-rc.22", features = [
  "derive",
  "function",
  "serde",
  "serde_json",
  "uuid",
] }

specta-typescript = "=0.0.9"


# NAPI 绑定：Electron 主进程是唯一的宿主，原生能力以 Node 动态库形态交付。
#
# napi 与 napi-derive 必须同大版本：宏展开出的代码直接调运行时 API，错一颗就编译不过。
napi = { version = "3", default-features = false, features = [
  "napi9", "serde-json", "tokio_rt",
] }
napi-derive = "3"
napi-build = "2"

# 大小写转换：契约导出要把 Rust 的 snake_case 命令名写成 TypeScript 的 lowerCamelCase。
# 自己写一份就是第二份命名规则，而命名规则必须与渲染层看到的一致。
heck = "0.5"

# Testing
proptest = "1.7.0"
rstest = "0.25.0"

# Local storage
#
# SQLite is bundled for consistent behavior across supported platforms.
# The application database is not encrypted at the SQLite layer.
rusqlite = { version = "0.40.1", features = [
  "bundled",
] }

# 让一个裸名字变成一条可启动的路径。手写 PATH × PATHEXT 遍历是这个 crate 的
# 既有职责：Zed 的 11 个 crate 全部依赖它，其中
# crates/project/src/debugger/dap_store.rs 的 which::which_in 与这里同构。
which = "8"

# 包管理器 view 与 agent --version 输出里的版本号判读。判据交给 semver 官方
# 实现 —— 与 cargo 自己用的是同一个 crate，不手搓字符串比大小。
semver = "1"

# 伪终端是平台 API：Unix 的 openpty 与 Windows 的 ConPTY 各有一套边界条件，
# 手搓必漏。portable-pty 是 WezTerm 抽出来的那一份，两个平台都由它兜。
portable-pty = "0.9"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
missing_docs = "allow"
non_ascii_idents = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_lifetimes = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
# Lint policy, grouped by intent.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# 真缺陷：不接受豁免。
dbg_macro = "deny"
exit = "deny"
mem_forget = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_dependencies = "deny"

# panic 纪律：生产代码收紧，测试逐处豁免。
#
# 「逐处」是字面意思，不是省略说法：这里只把生产代码收紧，放开由每个测试作用域
# 自己写一句 #![allow(clippy::expect_used, reason = "…")]（见 crates/agent-client
# 的 tests/sessions.rs 与 src/recorder.rs 的 mod tests）。
#
# 不在根上放一个 clippy.toml 开 allow-expect-in-tests：那个开关只认 #[cfg(test)]
# 模块与 #[test] 函数，盖不住集成测试里的辅助方法（Fixture::frames 的 .expect），
# 于是文件顶部那些 allow 一句也删不掉 —— 两套机制并存，比一套写全更差。
#
# 这段此前写的是「#[cfg(test)] 模块内层统一放开」。没有任何配置实现过那句话，
# 而它足以让人以为内联的 mod tests 不必自己写 —— src/recorder.rs 漏掉的那一句
# 就是这么漏的，并且一直没被发现：bun run clippy 之外的手跑命令都不带 --workspace，
# 而 default-members 只有 apps/desktop/native。
expect_used = "warn"
get_unwrap = "warn"
indexing_slicing = "warn"
panic = "warn"
unwrap_used = "warn"

# 工程卫生。
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
filetype_is_file = "warn"
large_futures = "warn"
lossy_float_literal = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
str_to_string = "warn"
string_add = "warn"
string_slice = "warn"
verbose_file_reads = "warn"

# 文档写作风格：不再当作缺陷。
#
# doc_markdown 就是「英文单词要加反引号」那一条：凡是它认为像标识符的词
# （驼峰、带点、带下划线、全大写）出现在文档注释里没被反引号包住，就报一条。
# 它属于上面打开的 pedantic 组，而 package.json 里 clippy 跑的是 -D warnings ——
# 一条写作风格建议在这个仓库里等价于构建失败。它也没有 biome 那种保存即修的
# 自动修复：TS 侧的同类规则 pnpm lint:fix 一跑就没了，这一条只能人手补反引号。
# 它还会误判：普通英文专有名词一样中招。
#
# missing_errors_doc / missing_panics_doc 与本文件上面的 missing_docs = "allow"
# 直接矛盾：完全不写文档是合法的，一旦写了 /// 就必须补一节 # Errors。两条合起来
# 的净效果是「不写文档没事，写了反而挨罚」，方向是反的。它逼出来的产物是可以数
# 出来的：一批逐字相同、贴在互不相干函数上的 # Errors 样板，没有告诉读者任何签名
# 里看不到的东西。那不是文档，是为了过 lint 生成的填充物。
#
# 闸门本身不放松：-D warnings 保留。放松的是闸门后面放什么 —— 只放真缺陷，
# 不放排版偏好。unwrap_used / expect_used / panic / indexing_slicing 一条没动。
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# 刻意关闭：收益低于噪音成本。
#
# as_conversions 一刀切禁止 `as`，而 pedantic 已提供更精确的
# cast_possible_truncation / cast_precision_loss / cast_sign_loss；
# 保留它只会把 `len() as u64` 逼成 try_from 样板。
as_conversions = "allow"
# multiple_inherent_impl 是纯风格偏好，多个 impl 块常常是刻意分组。
multiple_inherent_impl = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
type_complexity = "allow"

[profile.dev]
debug = 1
incremental = true
opt-level = 0

[profile.dev.package."*"]
opt-level = 1

[profile.test]
debug = 1
incremental = true
opt-level = 1

[profile.release]
codegen-units = 1
incremental = false
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
