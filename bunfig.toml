[install]
# 依赖隔离的前提：没声明的包 import 不到。关闭 hoist，否则 node_modules/.bun/node_modules 兜底目录会让未声明依赖照样可解析。
linker = "isolated"
hoist = false
exact = false

[test]
preload = ["./tooling/test/preload.ts", "./tooling/test/react-setup.ts"]
# 不扫描参考目录与构建产物
pathIgnorePatterns = ["**/node_modules/**", "**/out/**", "**/dist/**", "**/.tsbuild/**"]
