    <meta content="light dark" name="color-scheme" />

    <title>Poietica · 灵动 AI 伙伴</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500&display=swap');
      :root {
        --page: #f1efe8;
        --background: #fffdf7;
        --foreground: #171813;
        --card: #fffdf7;
        --card-foreground: #171813;
        --muted: #ebe8de;
        --muted-foreground: #6e7067;
        --secondary: #f0eee7;
        --secondary-foreground: #24251f;
        --border: #d5d1c5;
        --primary: #2f66e8;
        --primary-foreground: #ffffff;
        --viz-series-1: #5b7fe5;
        --orange: #e36f3d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #11130f;
          --background: #181a15;
          --foreground: #f3f0e7;
          --card: #1c1f19;
          --card-foreground: #f3f0e7;
          --muted: #292c25;
          --muted-foreground: #a5a89d;
          --secondary: #252821;
          --secondary-foreground: #f3f0e7;
          --border: #393d33;
          --primary: #6f96ff;
          --primary-foreground: #0c1630;
          --viz-series-1: #6689ea;
          --orange: #ff8b5e;
        }
      }
      * { box-sizing: border-box; }
      html { background: var(--page); color-scheme: light dark; }
      body {
        background: var(--page);
        color: var(--foreground);
        font-family: ui-sans-serif, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        margin: 0;
        min-width: 320px;
        padding: 16px 18px 24px;
      }
      .wrap { display: grid; gap: 12px; margin: 0 auto; max-width: 700px; }
      header .kicker {
        color: var(--primary);
        font-family: 'Azeret Mono', monospace;
        font-size: 0.7rem;
        letter-spacing: 0.12em;
      }
      header h1 {
        font-family: 'Fraunces', Georgia, serif;
        font-size: clamp(1.9rem, 5vw, 2.8rem);
        font-weight: 500;
        letter-spacing: -0.04em;
        line-height: 0.95;
        margin: 4px 0 8px;
      }
      header .sub { color: var(--muted-foreground); font-size: 0.92rem; line-height: 1.55; margin: 0; max-width: 58ch; }
      .stage-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        display: grid;
        gap: 2px;
        padding: 2px 14px 10px;
      }
      .stage { display: flex; justify-content: center; }
      .stage svg {
        -webkit-tap-highlight-color: transparent;
        cursor: pointer;
        height: auto;
        touch-action: manipulation;
        user-select: none;
        width: min(100%, 336px);
      }
      .caption {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        justify-content: center;
        min-height: 2.4em;
        text-align: center;
      }
      #scene-name {
        background: color-mix(in srgb, var(--primary) 9%, transparent);
        border: 1px solid color-mix(in srgb, var(--primary) 38%, transparent);
        border-radius: 999px;
        color: var(--primary);
        font-family: 'Azeret Mono', monospace;
        font-size: 0.76rem;
        letter-spacing: 0.08em;
        padding: 3px 10px;
        white-space: nowrap;
      }
      #scene-desc { color: var(--muted-foreground); font-size: 0.9rem; }
      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        display: grid;
        gap: 12px;
        padding: 12px 16px;
      }
      .group { display: grid; gap: 8px; }
      .group .label {
        color: var(--muted-foreground);
        font-family: 'Azeret Mono', monospace;
        font-size: 0.66rem;
        letter-spacing: 0.16em;
      }
      .chips { display: flex; flex-wrap: wrap; gap: 7px; }
      .chip {
        background: var(--secondary);
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--secondary-foreground);
        cursor: pointer;
        font-family: inherit;
        font-size: 0.88rem;
        padding: 8px 14px;
        transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
      }
      .chip:hover { transform: translateY(-1px); }
      .chip:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
      .chip[aria-pressed='true'] { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
      .toggle::before {
        background: var(--muted-foreground);
        border-radius: 999px;
        content: '';
        display: inline-block;
        height: 7px;
        margin-right: 7px;
        transition: background 0.2s ease;
        vertical-align: 1px;
        width: 7px;
      }
      .toggle[aria-pressed='true']::before { background: var(--primary-foreground); }
      .hint { color: var(--muted-foreground); font-size: 0.78rem; line-height: 1.6; margin: 0; }
      .hint code {
        background: var(--muted);
        border-radius: 5px;
        font-family: 'Azeret Mono', monospace;
        font-size: 0.72rem;
        padding: 1px 5px;
      }
      .footnote { color: var(--muted-foreground); font-size: 0.74rem; line-height: 1.6; margin: 0; padding: 0 4px; }
      .body { fill: var(--viz-series-1); }
      .eye { fill: var(--background); }
      #blush ellipse { fill: #f09aab; }
      #ground-shadow { fill: var(--foreground); }
      @media (max-width: 560px) {
        body { padding: 14px 12px 30px; }
        .stage svg { width: min(100%, 292px); }
      }
    </style>
  </head>

        <h1>灵动 AI 伙伴</h1>
        <p class="sub">

        </p>
      </header>

        </div>

          <span class="label">互动</span>
          <div class="chips">

            <button class="chip" id="poke" type="button">逗它一下</button>
          </div>

          </p>
        </div>
      </section>

      </p>

              spawn({
                shape: 'star', color: pick(['#EAC26B', '#5E9FE8', '#e8b54d', '#BF8EDA']),
                x: hx + Math.cos(a) * rand(52, 88), y: CY + sp.hy.x - 44 + Math.sin(a) * rand(26, 56),
                vx: rand(-38, 38), vy: rand(-54, -20), g: -14, drag: 0.6,
                vr: rand(-140, 140), tw: rand(8, 12),
                life: rand(0.55, 0.95), size: rand(0.7, 1.25),
              })
            } else {
              spawn({
                shape: 'heart', color: pick(HEART_COLORS),
                x: hx + rand(-1, 1) * 52, y: CY + sp.hy.x + rand(14, 38),
                vx: rand(-22, 22), vy: rand(-52, -30), g: -10, drag: 0.5,
                vr: rand(-36, 36), wob: rand(3, 6), wobF: rand(2.5, 4),
                life: rand(0.95, 1.3), size: rand(0.85, 1.2),
              })
            }
          }
        }
        function stepParts(dt) {
          for (let i = parts.length - 1; i >= 0; i--) {
            const p = parts[i]
            p.age += dt
            if (p.age >= p.life) { p.n.el.style.opacity = '0'; p.n.free = true; parts.splice(i, 1); continue }
            const damp = Math.max(0, 1 - p.drag * dt)
            p.vx *= damp; p.vy += p.g * dt
            p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt
            const px = p.x + (p.wob ? Math.sin(p.age * p.wobF) * p.wob * Math.min(1, p.age * 2) : 0)
            const grow = easeOut(Math.min(1, p.age / 0.14))
            const fade = p.age > p.life - 0.32 ? (p.life - p.age) / 0.32 : 1
            const tw = p.tw ? 0.78 + 0.3 * Math.sin(p.age * p.tw) : 1
            p.n.el.setAttribute('transform',
              `translate(${px.toFixed(2)} ${p.y.toFixed(2)}) rotate(${(p.rot % 360).toFixed(1)}) scale(${(grow * p.size * tw).toFixed(3)})`)
            p.n.el.style.opacity = (0.95 * fade).toFixed(3)
          }
        }

        // ===== 加载轨道星子（倾斜轨道 + 星形头 + 彗尾拖影）=====
        const DOT_COLORS = ['var(--primary)', 'var(--orange)', '#57ad82']
        const TRAIL_R = [2.7, 1.85, 1.15]
        const TRAIL_O = [0.45, 0.24, 0.11]
        const orbiters = DOT_COLORS.map(c => {
          const g = document.createElementNS('http://www.w3.org/2000/svg', 'g')
          const trail = TRAIL_R.map(() => {
            const t = document.createElementNS('http://www.w3.org/2000/svg', 'circle')
            t.setAttribute('fill', c)
            t.setAttribute('stroke', 'var(--card)')
            t.setAttribute('stroke-width', '0.9')
            t.setAttribute('paint-order', 'stroke')
            g.appendChild(t)
            return t
          })
          const head = document.createElementNS('http://www.w3.org/2000/svg', 'path')
          head.setAttribute('d', STAR_D)
          head.setAttribute('fill', c)
          head.setAttribute('stroke', 'var(--card)')
          head.setAttribute('stroke-width', '1.3')
          head.setAttribute('stroke-linejoin', 'round')
          head.setAttribute('paint-order', 'stroke')
          g.appendChild(head)
          g.style.opacity = '0'
          fxBack.appendChild(g)
          return { g, head, trail }
        })

        // ===== 场景切换（眨眼掩护 + 基线平滑过渡，无任何重置跳变）=====
        let tourOn = false, tourAt = Number.POSITIVE_INFINITY, tourIdx = 0
        function setScene(name, opts) {
          if (!SCENES[name] || name === sceneName) { return }
          const prev = sceneName
          scene = SCENES[name]; sceneName = name
          document.querySelectorAll('.chip[data-scene]').forEach((c) => {
            c.setAttribute(
              'aria-pressed',
              String(c.dataset.scene === name),
            )
          })
          $('scene-name').textContent = scene.label
          $('scene-desc').textContent = scene.desc
          sp.turn.t = scene.turnB || 0
          sp.es.t = scene.es || 1
          sp.sc.t = scene.scale || 1
          const P = scene.phys || {}
          sp.morph.f = P.mf || scene.tempo || 8.5
          sp.morph.z = P.mz != null ? P.mz : 0.92
          sp.hx.f = sp.hy.f = P.hf || 4.2
          sp.hx.z = sp.hy.z = P.hz != null ? P.hz : 0.88
          sp.hr.f = (P.hf || 4.2) * 1.15
          sp.hr.z = P.hz != null ? P.hz : 0.8
          sp.gx.f = sp.gy.f = P.gf || 7
          nextExpr = tNow + rand(scene.expr[0], scene.expr[1]) * 0.45 / 1000
          nextBlink = scene.blink ? tNow + rand(scene.blink[0], scene.blink[1]) * 0.5 / 1000 : Number.POSITIVE_INFINITY
          nextGaze = tNow + 0.05
          nextMicro = scene.micro ? tNow + rand(scene.micro.every[0], scene.micro.every[1]) * 0.6 / 1000 : Number.POSITIVE_INFINITY
          esSoftAt = Number.POSITIVE_INFINITY
          setExpression(pick(scene.pool))
          runFirstMatchingBranch([
            [() => (prev && !(opts?.silent)), () => { blink(scene.bKind === 'sleepy' ? 'soft' : 'quick') }]
          ])
          runFirstMatchingBranch([
            [() => (prev === 'loading'), () => { flourishAt = tNow + 0.18 }]
          ])
          runFirstMatchingBranch([
            [() => (scene.enter && !RM && !(opts?.silent)), () => { scene.enter() }]
          ])
        }

        // ===== 主循环：step（逻辑）+ render（绘制）=====
        function step(dt) {
          // 场景参数平滑混入（振幅/频率渐变，相位连续）
          const bl = (k, v) => { live[k] += (v - live[k]) * Math.min(1, 3.2 * dt) }
          bl('breathA', scene.breath[0] * AMP); bl('breathHz', scene.breath[1])
          bl('bobA', scene.bob[0] * AMP); bl('bobHz', scene.bob[1])
          bl('swayA', scene.sway[0] * AMP); bl('swayHz', scene.sway[1])
          bl('nodA', scene.nod[0] * AMP); bl('nodHz', scene.nod[1])
          bl('dots', scene.dots || 0); bl('blush', scene.blush || 0)
          bl('droop', scene.droop || 1); bl('mw', scene.mw != null ? scene.mw : 0.8)
          runFirstMatchingBranch([
            [() => (scene.tick), () => { scene.tick(dt) }]
          ])
          ph.breath += TAU * live.breathHz * dt
          ph.bob += TAU * live.bobHz * dt
          ph.sway += TAU * live.swayHz * dt
          ph.nod += TAU * live.nodHz * dt
          ph.orbit += TAU * (sceneName === 'loading' ? 0.55 : 0.3) * (1 + 0.16 * Math.sin(tNow * TAU / 4.6)) * dt

          // 调度器
          runFirstMatchingBranch([
            [() => (tNow > nextExpr), () => {
            const cand = scene.pool.filter(i => i !== exprIndex)
            setExpression(cand.length ? pick(cand) : scene.pool[0])
            nextExpr = tNow + rand(scene.expr[0], scene.expr[1]) / 1000
          }]
          ])
          runFirstMatchingBranch([
            [() => (tNow > nextBlink && !blinkAnim), () => {
            blink(scene.bKind || 'quick', Math.random() < 0.28)
            nextBlink = tNow + rand(scene.blink[0], scene.blink[1]) / 1000
          }]
          ])
          runFirstMatchingBranch([
            [() => (tNow > nextGaze), () => { retargetGaze() }]
          ])
          runFirstMatchingBranch([
            [() => (tNow > nextMicro && scene.micro), () => {
            scene.micro.run()
            nextMicro = tNow + rand(scene.micro.every[0], scene.micro.every[1]) / 1000
          }]
          ])
          runFirstMatchingBranch([
            [() => (tNow > burstAt), () => { burstAt = Number.POSITIVE_INFINITY; burst(burstN, burstKind) }]
          ])
          runFirstMatchingBranch([
            [() => (tNow > hopAt), () => { hopAt = Number.POSITIVE_INFINITY; play(G.hop(20)) }]
          ])
          runFirstMatchingBranch([
            [() => (tNow > winkAt), () => { winkAt = Number.POSITIVE_INFINITY; wink() }]
          ])
          runFirstMatchingBranch([
            [() => (tNow > dblBlinkAt), () => { dblBlinkAt = Number.POSITIVE_INFINITY; blinkHoldUntil = 0; blink('quick', true); sp.es.t = scene.es || 1 }]
          ])
          runFirstMatchingBranch([
            [() => (tNow > esSoftAt), () => { esSoftAt = Number.POSITIVE_INFINITY; sp.es.t = 1.06 }]
          ])
          runFirstMatchingBranch([
            [() => (tNow > flourishAt), () => { flourishAt = Number.POSITIVE_INFINITY; play(G.hop(11)); sp.es.x = (scene.es || 1) * 1.14; burst(6, 'sparkle') }]
          ])
          runFirstMatchingBranch([
            [() => (tNow > tourAt), () => {
            tourIdx = (tourIdx + 1) % TOUR.length
            setScene(TOUR[tourIdx])
            tourAt = tNow + 5.2
          }]
          ])
          runFirstMatchingBranch([
            [() => (intro.length && tNow > intro[0][0]), () => { intro.shift()[1]() }]
          ])

          // 微颤视线（扫视时的小跳动）
          const M = scene.gaze.mode
          runFirstMatchingBranch([
            [() => ((M === 'wander' || M === 'read') && Math.random() < dt * 0.35), () => {
            gazeT = { x: clamp(gazeT.x + rand(-0.06, 0.06), -1, 1), y: clamp(gazeT.y + rand(-0.04, 0.04), -1, 1) }
          }]
          ])

          // 视线目标：自主 vs 指针（按场景性格混合）
          let auto = gazeT
          runFirstMatchingBranch([
            [() => (M === 'circle'), () => { auto = { x: Math.cos(ph.orbit) * 0.55, y: Math.sin(ph.orbit) * 0.4 - 0.08 } }]
          ])
          const recent = clamp(1 - (tNow - pointer.at) / 2.5, 0, 1)
          const w = follow ? live.mw * recent : 0
          sp.gx.t = lerp(auto.x, pointer.x, w)
          sp.gy.t = lerp(auto.y, pointer.y, w)

          // 眼睛先动，头部跟随（慢半拍）
          sp.hx.t = sp.gx.x * 6.2
          sp.hy.t = (scene.y || 0) + sp.gy.x * 3.6
          sp.hr.t = (scene.rotB || 0) + sp.gx.x * 3.4
          sp.turn.t = (scene.turnB || 0) + sp.gx.x * 0.12

          for (const k in sp) { sp[k].step(dt) }
          stepParts(dt)
        }

        function render() {
          // 手势采样
          let gdy = 0, grot = 0, gsq = 0, gsc = 0, gturn = 0
          for (let i = gestures.length - 1; i >= 0; i--) {
            const g = gestures[i]
            const u = (tNow - g.t0) / g.dur
            if (u >= 1) { gestures.splice(i, 1); continue }
            if (u < 0) { continue }
            runFirstMatchingBranch([
              [() => (g.dy), () => { gdy += g.dy(u) }]
            ])
            runFirstMatchingBranch([
              [() => (g.rot), () => { grot += g.rot(u) }]
            ])
            runFirstMatchingBranch([
              [() => (g.sq), () => { gsq += g.sq(u) }]
            ])
            runFirstMatchingBranch([
              [() => (g.sc), () => { gsc += g.sc(u) }]
            ])
            runFirstMatchingBranch([
              [() => (g.turn), () => { gturn += g.turn(u) }]
            ])
          }
          // 呼吸/漂浮/摇曳/点头
          const br = Math.sin(ph.breath) * live.breathA
          const dy = Math.sin(ph.bob) * 2.6 * live.bobA + br * 1.1 + Math.sin(ph.nod) * 1.7 * live.nodA + gdy
          const rot = Math.sin(ph.sway) * 1.35 * live.swayA + sp.hr.x + grot
          const sq = gsq + sp.press.x
          const S = sp.sc.x + gsc
          const sxF = S * (1 - sq * 0.85) * (1 - br * 0.005)
          const syF = S * (1 + sq) * (1 + br * 0.011)
          const x = CX + sp.hx.x, y = CY + sp.hy.x + dy
          rig.setAttribute('transform',
            `translate(${x} ${y}) rotate(${rot}) scale(${sxF} ${syF}) translate(${-CX} ${-CY})`)

          // 地面阴影（跟随跳跃收缩/变淡）
          const lift = Math.max(0, -(sp.hy.x + dy - (scene.y || 0)))
          const shS = clamp(1 - lift / 140, 0.5, 1.2) * S
          shadowEl.setAttribute('cx', CX + sp.hx.x * 0.85)
          shadowEl.setAttribute('rx', 74 * shS)
          shadowEl.setAttribute('ry', 10 * shS)
          shadowEl.setAttribute('opacity', (0.16 * clamp(1 - lift / 120, 0.35, 1)).toFixed(3))

          // 脸红
          blushEl.setAttribute('opacity', (live.blush * 0.6).toFixed(3))

          // 眼睛：球面投影（与原版同源）+ 眨眼/垂目/放大
          const morphMoving = Math.abs(sp.morph.x - sp.morph.t) > 0.0008 || Math.abs(sp.morph.v) > 0.004
          const rings = currentRings()
          const eyeInfo = [null, null]
          const open = openness()
          const turnAll = sp.turn.x + gturn
          const gxU = sp.gx.x * 13.2, gyU = sp.gy.x * 8.4
          const wk = 1 + clamp((Math.abs(sp.gx.v) + Math.abs(sp.gy.v)) * 0.05, 0, 0.07)
          rings.forEach((ring, i) => {
            let cx = 0, cy = 0, botY = -1e9
            for (const p of ring) { cx += p[0]; cy += p[1]; runFirstMatchingBranch([
  [() => (p[1] > botY), () => { botY = p[1]  }]
])}
            cx /= ring.length; cy /= ring.length
            const baseLong = Math.asin(clamp((cx - CX) / R, -1, 1))
            const long = baseLong + turnAll
            const depth = Math.cos(long)
            const persp = Math.max(depth, 0.02) / Math.max(Math.cos(baseLong), 0.02)
            const ex = CX + R * Math.sin(long) + gxU
            const ey = cy + gyU
            const sx = clamp(persp * sp.es.x * wk, 0.02, 2.6)
            // 双枚轴：尺寸缩放绕眼心，眨眼/垂目绕下眼睑线收合（像真实眼皮从上落下）
            const sLid = clamp(open * winkEnv(i) * live.droop, 0.02, 1.1)
            const sSize = clamp(sp.es.x * wk, 0.05, 2.6)
            const py = cy + (botY - cy) * 0.78
            const dY = sSize * sLid
            const fY = ey - cy + py + sLid * (cy * (1 - sSize) - py)
            const el = eyeEls[i]
            runFirstMatchingBranch([
              [() => (morphMoving || pathDirty), () => {
              el.setAttribute('d', `M${ring.map(p => `${p[0].toFixed(2)} ${p[1].toFixed(2)}`).join('L')}Z`)
            }]
            ])
            el.setAttribute('transform', `matrix(${sx.toFixed(4)} 0 0 ${dY.toFixed(4)} ${(ex - sx * cx).toFixed(3)} ${fY.toFixed(3)})`)
            el.style.opacity = depth > 0.02 ? '1' : '0'
            eyeInfo[i] = { x: ex, y: ey, p: persp, d: depth, bl: baseLong, ta: turnAll }
          })
          pathDirty = morphMoving

          // 腮红固定在脸颊经线上（眼睛外侧约 9° 经度），随球面转头投影，不会滑出脸缘
          if (live.blush > 0.01) {
            for (let i = 0; i < 2; i++) {
              const e = eyeInfo[i]
              if (!e) { continue }
              const side = e.bl >= 0 ? 1 : -1
              const bBase = e.bl + side * 0.16
              const bLong = bBase + e.ta
              const bd = Math.cos(bLong)
              const bp = Math.max(bd, 0.02) / Math.max(Math.cos(bBase), 0.02)
              const bx = CX + R * 0.94 * Math.sin(bLong)
              blushEls[i].setAttribute('transform',
                `translate(${bx.toFixed(2)} ${(e.y + 33).toFixed(2)}) scale(${Math.max(bp * 0.9, 0.05).toFixed(3)} 1)`)
              blushEls[i].style.opacity = clamp((bd - 0.1) / 0.32, 0, 1).toFixed(3)
            }
          }

          // 轨道星子：倾斜轨道面 + 星形头自旋 + 彗尾拖影（前/后景深）
          runFirstMatchingBranch([
            [() => (live.dots > 0.01), () => {
            const orx = 141 * S, ory = 44
            const ct = 0.988, st = -0.156
            orbiters.forEach((o, i) => {
              const a = ph.orbit + (i * TAU) / 3
              const sd = Math.sin(a)
              const ex0 = Math.cos(a) * orx, ey0 = sd * ory
              const hs = 1.12 * (0.74 + 0.34 * sd)
              o.head.setAttribute('transform',
                `translate(${(x + ex0 * ct - ey0 * st).toFixed(2)} ${(y + 26 + ex0 * st + ey0 * ct).toFixed(2)}) rotate(${((a * 86) % 360).toFixed(1)}) scale(${hs.toFixed(3)})`)
              o.head.style.opacity = (0.62 + 0.38 * sd).toFixed(3)
              o.trail.forEach((tr, k) => {
                const ak = a - (k + 1) * 0.1
                const sk = Math.sin(ak)
                const tx0 = Math.cos(ak) * orx, ty0 = sk * ory
                tr.setAttribute('cx', (x + tx0 * ct - ty0 * st).toFixed(2))
                tr.setAttribute('cy', (y + 26 + tx0 * st + ty0 * ct).toFixed(2))
                tr.setAttribute('r', (TRAIL_R[k] * (0.72 + 0.34 * sk)).toFixed(2))
                tr.style.opacity = (TRAIL_O[k] * (0.5 + 0.5 * sk)).toFixed(3)
              })
              o.g.style.opacity = live.dots.toFixed(3)
              const wantFront = sd > 0.04
              runFirstMatchingBranch([
                [() => (wantFront !== (o.g.parentNode === fxFront)), () => { (wantFront ? fxFront : fxBack).appendChild(o.g) }]
              ])
            })
          }],
            [() => true, () => {
            orbiters.forEach(o => { o.g.style.opacity = '0' })
          }]
          ])
        }

        // ===== 互动 =====
        addEventListener('pointermove', e => {
          const r = svg.getBoundingClientRect()
          const cx = r.left + r.width / 2, cy = r.top + r.height / 2
          const rx = Math.max(220, Math.min(innerWidth * 0.55, 520))
          const ry = Math.max(200, Math.min(innerHeight * 0.55, 420))
          pointer.x = clamp((e.clientX - cx) / rx, -1, 1)
          pointer.y = clamp((e.clientY - cy) / ry, -1, 1)
          pointer.at = performance.now() / 1000
        }, { passive: true })

        function react() {
          if (sceneName === 'shy') { burst(3, 'heart'); play(G.peekTurn(-0.3)); return }
          if (sceneName === 'sleepy' || sceneName === 'sad') {
            play(G.wake()); blink('quick', true); setExpression(sceneName === 'sleepy' ? 3 : 0); return
          }
          if (sceneName === 'hello') { wink(); return }
          pick([
            () => { play(G.hop(18)); setExpression(pick([2, 17, 11])) },
            () => play(G.spin(pick([-1, 1]))),
            () => { play(G.recoil()); sp.es.x = 1.35; blinkHoldUntil = tNow + 0.7; dblBlinkAt = tNow + 0.75 },
            () => { burst(9, 'sparkle'); play(G.hop(12)) },
            () => { burst(2, 'heart'); play(G.hop(10)); setExpression(2) },
          ])()
        }
        let pressed = false
        svg.addEventListener('pointerdown', () => { pressed = true; sp.press.t = -0.06 })
        addEventListener('pointerup', () => {
          if (!pressed) { return }
          pressed = false; sp.press.t = 0; react()
        })
        addEventListener('pointercancel', () => { pressed = false; sp.press.t = 0 })

        // 场景按钮
        function chip(name) {
          const b = document.createElement('button')
          b.type = 'button'
          b.className = 'chip'
          b.dataset.scene = name
          b.textContent = SCENES[name].label
          b.setAttribute('aria-pressed', 'false')
          b.addEventListener('click', () => {
            if (tourOn) { toggleTour(false) }
            setScene(name)
          })
          return b
        }
        LIFE.forEach((n) => {
          $('chips-life').appendChild(chip(n))
        })
        EMOTION.forEach((n) => {
          $('chips-emotion').appendChild(chip(n))
        })

        function toggleTour(on) {
          tourOn = on != null ? on : !tourOn
          $('tour').setAttribute('aria-pressed', String(tourOn))
          if (tourOn) {
            tourIdx = Math.max(0, TOUR.indexOf(sceneName))
            tourAt = tNow + 0.01
          } else { tourAt = Number.POSITIVE_INFINITY }
        }
        $('tour').addEventListener('click', () => toggleTour())
        $('follow').addEventListener('click', () => {
          follow = !follow
          $('follow').setAttribute('aria-pressed', String(follow))
        })
        $('poke').addEventListener('click', react)

        addEventListener('keydown', e => {
          if (e.target && /^(input|textarea|select)$/i.test(e.target.tagName)) { return }
          if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
            e.preventDefault()
            if (tourOn) { toggleTour(false) }
            const d = e.key === 'ArrowRight' ? 1 : -1
            const i = Math.max(0, ORDER.indexOf(sceneName))
            setScene(ORDER[(i + d + ORDER.length) % ORDER.length])
          } else if (e.key === ' ') {
            e.preventDefault(); play(G.hop(16))
          }
        })
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) { last = performance.now() / 1000 }
        })

        // ===== 初始化：支持 ?scene= 直达与 QA 预热 =====
        const INIT_SCENE = 'idle'
        const QA_MODE = false
        const qp = new URLSearchParams(location.search)
        const wanted = qp.get('scene')
        const initial = SCENES[wanted] ? wanted : INIT_SCENE
        const qa = QA_MODE || qp.has('qa')

        // 开场：睛开眼睛、伸个懒腰、左右看看——像刚上线的小家伙
        const intro = []
        setScene(initial, { silent: true })
        if (!qa && !RM && initial === 'idle') {
          sp.open.x = 0; sp.open.t = 0
          blinkHoldUntil = tNow + 1.3
          const t0 = tNow
          intro.push(
            [t0 + 0.45, () => { sp.open.t = 1; play(G.wake()) }],
            [t0 + 1.35, () => blink('quick', true)],
            [t0 + 1.75, () => { gazeT = { x: -0.45, y: -0.12 }; nextGaze = t0 + 2.6 }],
            [t0 + 2.35, () => { gazeT = { x: 0.42, y: -0.06 }; nextGaze = t0 + 3.2 }],
          )
        }
        const QA_FX = false
        if (qa) {
          for (let i = 0; i < 300; i++) { tNow += 1 / 60; step(1 / 60) }
          if (QA_FX) {
            burst(20, 'confetti'); burst(8, 'sparkle'); burst(3, 'heart')
            for (let i = 0; i < 24; i++) { tNow += 1 / 60; step(1 / 60) }
          }
          render()
        }

        let _rafId
        function frame(now) {
          tNow = now / 1000
          const dt = Math.min(Math.max(tNow - last, 0.0005), 0.05)
          last = tNow
          step(dt)
          render()
          _rafId = requestAnimationFrame(frame)
        }
        last = performance.now() / 1000
        tNow = last
        _rafId = requestAnimationFrame(frame)

        // 方便在控制台把玩：window.avatar.setScene('happy')
        window.avatar = { setScene, scenes: Object.keys(SCENES), react }
      })()
    </script>
  </body>
