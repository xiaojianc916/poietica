name: Security

# Advisory 数据库每天都在变，同一份代码今天绿明天红。把它放在定时任务里，
# 它就是一份每日安全报告；放在 PR 门禁里，它只是随机噪声。
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: Advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JS toolchain
        uses: ./.github/actions/setup-js

      - name: JavaScript dependency audit
        run: bun run audit

      - name: Rust advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features advisories
