name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  BUNDLE_DIR: target/x86_64-pc-windows-msvc/release/bundle/nsis

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup JS toolchain
        uses: ./.github/actions/setup-js

      - name: Install Rust
        run: rustup show

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Verify release version
        run: bun run check:versions "${{ github.ref_name }}"


      - name: JavaScript dependency audit
        run: bun run audit

      # cargo-deny-action 是容器 action，只在 Linux 上可运行；发行在 windows-latest，
      # 改用跨平台的 install-action 装二进制后直接跑 cargo deny，命令与 package.json 的 audit:rust 一致。
      - name: Install cargo-deny
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: cargo-deny

      - name: Rust dependency policy
        run: cargo deny check --all-features

      - name: Build signed draft release
        id: release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bun tauri
          args: --target x86_64-pc-windows-msvc --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Poietica ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          retryAttempts: 2

      - name: Smoke test installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setups = @(Get-ChildItem $env:BUNDLE_DIR -Filter "*-setup.exe" -File)
          if ($setups.Count -ne 1) {
            throw "Expected one NSIS installer, found $($setups.Count)"
          }
          $setup = $setups[0]
          if (-not (Test-Path "$($setup.FullName).sig")) {
            throw "Updater signature is missing for $($setup.Name)"
          }
          $install = Start-Process $setup.FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Silent installer exited with $($install.ExitCode)"
          }
          $installed = @(
            Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Poietica.exe" -File |
              Select-Object -First 2
          )
          if ($installed.Count -ne 1) {
            throw "Expected one installed Poietica.exe, found $($installed.Count)"
          }
          try {
            $bytes = [System.IO.File]::ReadAllBytes($installed[0].FullName)
            $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
            $subsystem = [System.BitConverter]::ToUInt16($bytes, $peOffset + 0x5C)
            if ($subsystem -ne 2) {
              throw "Poietica.exe is not a Windows GUI binary"
            }
          } finally {
            $uninstaller = Join-Path $installed[0].DirectoryName "uninstall.exe"
            if (Test-Path $uninstaller) {
              Start-Process $uninstaller -ArgumentList "/S" -Wait
            }
          }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Set-Content SHA256SUMS.txt -Encoding utf8

      - name: Upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $arguments = @("release", "edit", $env:GITHUB_REF_NAME, "--draft=false")
          if ($env:GITHUB_REF_NAME -match "-") {
            $arguments += "--prerelease"
          } else {
            $arguments += "--latest"
          }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the release" }

      - name: Verify stable update channel
        if: ${{ !contains(github.ref_name, '-') }}
        run: bun tools/release/verify-channel.ts "${{ github.ref_name }}"

      - name: Roll back failed release
        if: ${{ failure() || cancelled() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          $releaseSha = $env:GITHUB_SHA
          $versionFiles = @(
            "Cargo.toml",
            "package.json",
            "apps/desktop/package.json",
            "apps/desktop/src-tauri/tauri.conf.json"
          )

          gh auth setup-git
          if ($LASTEXITCODE -ne 0) { throw "Could not configure Git authentication" }
          git fetch origin main --tags
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch origin/main" }
          git switch --force-create release-rollback origin/main
          if ($LASTEXITCODE -ne 0) { throw "Could not check out origin/main" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign false

          $releaseProbe = gh release view $tag --json url 2>&1
          $releaseStatus = $LASTEXITCODE
          $releaseExists = $releaseStatus -eq 0
          if (-not $releaseExists -and "$releaseProbe" -notmatch "release not found|HTTP 404") {
            throw "Could not inspect release ${tag}: $releaseProbe"
          }

          git merge-base --is-ancestor $releaseSha HEAD
          $ancestorStatus = $LASTEXITCODE
          if ($ancestorStatus -ne 0 -and $ancestorStatus -ne 1) {
            throw "Could not inspect release ancestry"
          }
          $containsRelease = $ancestorStatus -eq 0
          $needsRevert = $false

          if ($containsRelease) {
            git diff --quiet $releaseSha HEAD -- @versionFiles
            $versionStatus = $LASTEXITCODE
            if ($versionStatus -eq 0) {
              $needsRevert = $true
            } elseif ($versionStatus -eq 1) {
              Write-Host "Version files moved past $tag; preserving the newer version owner"
            } else {
              throw "Could not compare current version files with $releaseSha"
            }
          } else {
            Write-Host "origin/main no longer contains $releaseSha; no version revert is needed"
          }

          $updates = @()
          if ($needsRevert) {
            $subject = (git show --no-patch --format=%s $releaseSha).Trim()
            if ($LASTEXITCODE -ne 0 -or $subject -ne "release: $tag") {
              throw "Refusing to revert unexpected release commit $releaseSha"
            }
            $expected = @($versionFiles | Sort-Object)
            $actual = @(git diff-tree --no-commit-id --name-only -r $releaseSha | Sort-Object)
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect $releaseSha" }
            $difference = @(Compare-Object -ReferenceObject $expected -DifferenceObject $actual)
            if ($difference.Count -ne 0) {
              throw "Refusing to revert commit with unexpected files: $($actual -join ", ")"
            }
            git revert --no-edit $releaseSha
            if ($LASTEXITCODE -ne 0) { throw "Could not revert release commit $releaseSha" }
            $updates += "HEAD:refs/heads/main"
          }

          $remoteTag = @(git ls-remote --refs origin "refs/tags/$tag")
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect remote tag $tag" }
          if ($remoteTag.Count -gt 0) { $updates += ":refs/tags/$tag" }

          if ($updates.Count -gt 0) {
            git push --atomic --no-verify origin @updates
            if ($LASTEXITCODE -ne 0) { throw "Could not atomically roll back $tag" }
          }
          if ($releaseExists) {
            gh release delete $tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Could not delete GitHub release $tag" }
          }
          Write-Host "Rolled back failed release $tag"
