name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  BUNDLE_DIR: target/x86_64-pc-windows-msvc/release/bundle/nsis

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-js
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Release preflight
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "TAURI_SIGNING_PRIVATE_KEY is not set" }
      - run: bun run check:versions "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"
      - run: bun run check
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
      - run: bun run build:release
      - name: Collect updater artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          $files = Get-ChildItem $env:BUNDLE_DIR -Recurse | Where-Object { $_.Name -match "(\.exe|\.nsis\.zip|\.sig)$" }
          if ($files.Count -eq 0) { throw "No release artifacts were produced" }
          $files | Copy-Item -Destination dist-release
      - name: Build official updater manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: bun tools/release/manifest.ts dist-release "${{ github.ref_name }}"
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist-release -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content dist-release/SHA256SUMS.txt -Encoding utf8
      - name: Smoke test installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-release -Filter *-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "No NSIS installer to smoke test" }
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $installed = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter Poietica.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw "Silent install did not place Poietica.exe" }
      - uses: actions/upload-artifact@v4
        with:
          name: poietica-windows-release
          path: dist-release/*
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist-release/*
      - name: Verify update channel
        if: startsWith(github.ref, 'refs/tags/v')
        run: bun tools/release/verify-channel.ts "${{ github.ref_name }}"
