name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # 门禁只有一条命令表：package.json 的 check。平台取发行平台 Windows；
  # Release workflow 不重复执行，只负责发行专属的签名、冒烟与发布。
  check:
    name: Check
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JS toolchain
        uses: ./.github/actions/setup-js

      - name: Install Rust
        run: rustup show # honours rust-toolchain.toml

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # catalog 是 gitignore 的生成物，干净检出里没有，门禁前现拉。
      - name: Generate model catalog
        run: bun run models:update

      - name: Quality gate
        run: bun run check

      - name: Build web assets
        run: bun run build:web

  dependencies:
    name: Dependencies
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 只跑确定性子集。advisories 依赖外部数据库，会让无关 PR 随机变红，
      # 它属于 security.yml 的定时任务。
      # cargo-deny-action 是容器 action，只在 Linux 上可运行；PR 门禁跑在
      # windows-latest，改用跨平台的 install-action 装二进制后直接跑 cargo deny。
      - name: Install cargo-deny
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: cargo-deny

      - name: Dependency policy
        run: cargo deny check --all-features bans licenses sources

  windows-desktop:
    name: Windows Desktop
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JS toolchain
        uses: ./.github/actions/setup-js

      - name: Install Rust
        run: rustup show # honours rust-toolchain.toml

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # catalog 是 gitignore 的生成物，干净检出里没有，构建前现拉。
      - name: Generate model catalog
        run: bun run models:update

      # turbo.json 中 build.dependsOn 已包含 typecheck，无需单独再跑一遍。
      - name: Build Windows desktop binary
        run: bun run build:debug
