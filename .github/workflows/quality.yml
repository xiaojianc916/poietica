name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # 门禁只有一条命令表：package.json 的 check。平台取发行平台 Windows，
  # 发布工作流跑的是同一条命令，PR 因此不会漏过只在 Windows 上红的检查。
  check:
    name: Check
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JS toolchain
        uses: ./.github/actions/setup-js

      - name: Install Rust
        run: rustup show # honours rust-toolchain.toml

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Quality gate
        run: bun run check

      - name: Build web assets
        run: bun run build:web

  dependencies:
    name: Dependencies
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 只跑确定性子集。advisories 依赖外部数据库，会让无关 PR 随机变红，
      # 它属于 security.yml 的定时任务与发布门禁。
      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features bans licenses sources

  windows-desktop:
    name: Windows Desktop
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JS toolchain
        uses: ./.github/actions/setup-js

      - name: Install Rust
        run: rustup show # honours rust-toolchain.toml

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # turbo.json 中 build.dependsOn 已包含 typecheck，无需单独再跑一遍。
      - name: Build Windows desktop binary
        run: bun run build:debug
