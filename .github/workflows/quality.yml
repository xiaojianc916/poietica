name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # 纯 JS 检查放在 Linux；Windows 专用于原生桌面验证。
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JS toolchain
        uses: ./.github/actions/setup-js

      # 一条命令覆盖 biome ci（带 GitHub annotation）、架构规则、typecheck 与 bun test。
      # CI 不维护第二份命令表：package.json 的 check:web 是唯一那一份。
      - name: Web checks
        run: bun run check:web

      - name: Build web assets
        run: bun run build:web

  rust:
    name: Rust
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup show # honours rust-toolchain.toml

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      # Clippy 已覆盖编译，无需另跑 cargo check。
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      # 只跑确定性子集。advisories 依赖外部数据库，会让无关 PR 随机变红，
      # 它属于 security.yml 的定时任务与发布门禁。
      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features bans licenses sources

  windows-desktop:
    name: Windows Desktop
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JS toolchain
        uses: ./.github/actions/setup-js

      - name: Install Rust
        run: rustup show # honours rust-toolchain.toml

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # 唯一同时具备 Bun 与 Rust 的 job，IPC 校验因此放这里，不写第二份 PowerShell。
      - name: Verify generated IPC bindings
        run: bun run ipc:check

      # turbo.json 中 build.dependsOn 已包含 typecheck，无需单独再跑一遍。
      - name: Build Windows desktop binary
        run: bun run build:debug
